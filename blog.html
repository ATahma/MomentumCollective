---
layout: page
title: Blog
permalink: /blog/
bodyClass: page-about
---


<h1>Latest Posts</h1>

<ul>
  {% for post in site.posts %}
    <li>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <p><small>{{ post.date | date_to_string }}</small></p>
      {{ post.excerpt }}
    </li>
  {% endfor %}
</ul>
